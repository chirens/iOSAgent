name: Build iOSAgent IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project iOSAgent.xcodeproj \
            -target iOSAgent \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "--- build errors (last 120 lines) ---"
            grep -E "(error:|warning:|note:|undefined|undeclared|expected)" build.log | tail -120 || true
            echo "--- raw tail ---"
            tail -80 build.log
          fi
          exit $BUILD_EXIT

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$PWD/build" -name "iOSAgent.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "App not found"; exit 1; fi
          cd "$(dirname "$APP_PATH")"
          rm -rf Payload
          mkdir -p Payload
          cp -r iOSAgent.app Payload/
          zip -r "$PWD/iOSAgent-unsigned.ipa" Payload
          echo "IPA=$(pwd)/iOSAgent-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSAgent-unsigned-${{ github.run_id }}
          path: build/*/iOSAgent-unsigned.ipa

      - name: Upload build log artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSAgent-build-log-${{ github.run_id }}
          path: |
            build.log
            build_errors.log
